<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff5d3a'/%3E%3Cpath d='M5 22l6-8 5 5 6-11 5 7' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="static/css/style.css">
</head>
<body>
<header id="top">
  <div class="logo"><svg viewBox="0 0 32 32" width="22" height="22"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M5 22l6-8 5 5 6-11 5 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><b>runlytics</b></div>
  <div id="tabsWrap"><button class="arr l" id="tabL" title="Scroll tabs left"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><nav id="tabs"></nav><button class="arr r" id="tabR" title="Scroll tabs right"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>
  <span id="status"><i class="dot"></i><span id="stxt">connecting…</span></span>
  <button class="ib" id="reload" title="Refresh now"><svg viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/></svg></button>
  <button class="ib" id="themeBtn" title="Theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</header>
<div id="app">
<aside id="side" class="dock">
  <div class="dh"><span>Runs <span id="runCount" class="badge"></span></span><button class="ib ex" id="leftX" title="Collapse"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button></div>
  <div class="dbody">
    <div class="fwrap"><input id="runFilter" placeholder="Filter runs"><span class="fopts" data-for="run"><button data-o="case" title="Match case">Aa</button><button data-o="word" title="Match whole word">ab</button><button data-o="regex" title="Use regular expression">.*</button></span></div>
    <div class="srow"><select id="runSort" title="Sort runs"><option value="name">Name</option><option value="mtime">Date modified</option><option value="created">Date created</option><option value="size">Size</option></select><button class="btn2" id="sortDir" title="Sort direction">A→Z</button></div>
    <div class="btns"><button class="btn2" id="rAll">All</button><button class="btn2" id="rNone">None</button><button class="btn2" id="rInv">Invert</button></div>
    <div id="runList"><div id="runInner"></div></div>
  </div>
</aside>
<div class="rz" id="rzL"></div>
<button class="rail l" id="leftRail" title="Show runs"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg><span>Runs</span></button>
<main id="main">
  <div id="toolbar">
    <div class="fwrap tagf"><input id="tagFilter" placeholder="Filter tags, press /"><span class="fopts" data-for="tag"><button data-o="case" title="Match case">Aa</button><button data-o="word" title="Match whole word">ab</button><button data-o="regex" title="Use regular expression">.*</button></span></div>
    <button class="btn2" id="collapseAll">Collapse all</button><button class="btn2" id="expandAll">Expand all</button><button class="btn2" id="unpinTb" style="display:none">Unpin all</button>
    <span class="sp"></span>
    <button class="tb" id="setBtn" title="Settings"><svg viewBox="0 0 24 24" id="gearI"></svg>Settings</button>
  </div>
  <div id="content"></div>
</main>
<div class="rz" id="rzR"></div>
<aside id="settings" class="dock">
  <div class="dh"><span>Settings</span><button class="ib ex" id="rightX" title="Collapse"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>
  <div class="dbody">
    <details open><summary>General</summary>
      <label class="f">Horizontal axis</label>
      <select id="xaxis"><option value="step">Step</option><option value="relative">Relative</option><option value="wall">Wall</option></select>
      <label class="f">Chart width <span><output id="cardWV">360</output> px</span></label>
      <input type="range" id="cardW" min="220" max="900" step="10">
      <label class="chk"><input type="checkbox" id="arOn"> Auto refresh</label>
      <div class="arrow2"><label class="f">Every (seconds, min 5)</label><input type="number" id="arSec" min="5" step="1"></div>
      <label class="f">Max points per line</label>
      <select id="maxPoints"><option>500</option><option>1000</option><option>1500</option><option>3000</option><option>10000</option></select>
    </details>
    <details open><summary>Scalars</summary>
      <label class="f">Smoothing</label>
      <div class="sm2"><input type="range" id="smooth" min="0" max="0.99" step="0.01"><input type="number" id="smoothN" min="0" max="0.99" step="0.01"></div>
      <label class="chk"><input type="checkbox" id="raw"> Show unsmoothed line</label>
      <label class="chk"><input type="checkbox" id="ylog"> Log Y axis</label>
      <label class="chk"><input type="checkbox" id="clip"> Ignore outliers in Y</label>
      <label class="chk"><input type="checkbox" id="tipOn"> Show tooltip</label>
      <label class="f">Tooltip sorting</label>
      <select id="tipSort"><option value="default">Default</option><option value="asc">Ascending</option><option value="desc">Descending</option><option value="name">Name</option></select>
    </details>
    <details><summary>Histograms</summary>
      <label class="f">Mode</label>
      <select id="histMode"><option value="offset">Offset</option><option value="overlay">Overlay</option></select>
    </details>
  </div>
</aside>
</div>
<div id="veil"></div>
<script>window.__BOOT__="__BOOT__"</script>
<script src="static/js/util.js"></script>
<script src="static/js/chart.js"></script>
<script src="static/js/line.js"></script>
<script src="static/js/histogram.js"></script>
<script src="static/js/media.js"></script>
<script src="static/js/structured.js"></script>
<script src="static/js/hints.js"></script>
<script src="static/js/cards.js"></script>
<script src="static/js/main.js"></script>
</body>
</html>
