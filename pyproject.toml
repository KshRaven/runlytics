[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "runlytics"
dynamic = ["version"]
description = "A fast, lazy, modern experiment dashboard and SummaryWriter."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Bradley Odimmasi" }]
keywords = ["machine-learning", "experiment-tracking", "visualization", "dashboard", "logging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
fast = ["numpy", "google-crc32c"]
media = ["numpy", "Pillow", "matplotlib"]
dev = ["pytest", "ruff", "numpy"]

[project.scripts]
runlytics = "runlytics.cli:main"

[tool.setuptools.dynamic]
version = { attr = "runlytics._version.__version__" }

[tool.setuptools.packages.find]
include = ["runlytics*"]

[tool.setuptools.package-data]
runlytics = ["py.typed", "web/*.html", "web/css/*", "web/js/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E701", "E702", "E731", "UP007", "UP035"]
